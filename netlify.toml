[build]
  # Run from monorepo root so pnpm workspace resolves correctly
  base    = "."
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.1.2"

# SPA fallback — redirect all routes to index.html so Vue Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache busting for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
